name: Refresh news and Field Notes

on:
  workflow_dispatch:
  push:
    paths:
      - "content/field-notes/**"
      - "news-sources.json"
      - "scripts/build_field_notes.py"
      - "scripts/update_news.py"
      - "requirements.txt"
      - ".github/workflows/refresh-content.yml"
  schedule:
    # GitHub cron uses UTC. Run broadly enough to cover 8 a.m.-6 p.m.
    # Toronto time year-round; the first step filters DST-only edge hours.
    - cron: "11 12-23 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-site-content
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check Toronto refresh window
        id: refresh-window
        shell: bash
        run: |
          toronto_hour="$(TZ=America/Toronto date +%H)"
          if [[ "${{ github.event_name }}" != "schedule" ]] \
            || (( 10#$toronto_hour >= 8 && 10#$toronto_hour <= 18 )); then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the site
        if: steps.refresh-window.outputs.should-run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.refresh-window.outputs.should-run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install content tools
        if: steps.refresh-window.outputs.should-run == 'true'
        run: pip install -r requirements.txt

      - name: Refresh news
        if: steps.refresh-window.outputs.should-run == 'true'
        run: python scripts/update_news.py

      - name: Build Field Notes
        if: steps.refresh-window.outputs.should-run == 'true'
        run: python scripts/build_field_notes.py

      - name: Publish generated content
        if: steps.refresh-window.outputs.should-run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/field-notes.json field-notes news.xml
          if git diff --cached --quiet; then
            echo "No content changes to publish."
            exit 0
          fi
          git commit -m "chore: refresh news and Field Notes"
          git push
